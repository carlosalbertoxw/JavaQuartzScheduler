# Configuracion del scheduler de Quartz (reemplaza a org/quartz/quartz.properties del jar).
org.quartz.scheduler.instanceName = JavaQuartzScheduler

# Hilos disponibles para ejecutar rutinas en paralelo (rutinas distintas).
org.quartz.threadPool.class = org.quartz.simpl.SimpleThreadPool
org.quartz.threadPool.threadCount = 5

# Las rutinas viven en memoria: se reconstruyen desde routines.yml en cada arranque.
org.quartz.jobStore.class = org.quartz.simpl.RAMJobStore
org.quartz.jobStore.misfireThreshold = 60000
